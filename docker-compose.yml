version: '3.9'

services:
  # МИКРОСЕРВИС 1: RAG
  search-api:
    build:
      context: .
      dockerfile: src/rag/Dockerfile
    container_name: search_api_service
    working_dir: /app
    # В режиме host директива ports игнорируется, сервис займет порт 8080 прямо на хосте
    network_mode: host
    environment:
      - PORT=8080
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
    # Переопределяем команду запуска через .venv
    command: .venv/bin/python -m uvicorn search_service:app --host 127.0.0.1 --port 8080
    volumes:
      - ./src/rag/config.json:/app/config.json
      - ./chroma_data:/app/chroma_data

  # МИКРОСЕРВИС 2: Бот
  bot-api:
    build:
      context: .
      dockerfile: src/bot/Dockerfile
    container_name: bot_api_service
    working_dir: /app
    # Бот также садится на хостовую сеть и займет порт 8081
    network_mode: host
    environment:
      - PORT=8081
      - OLLAMA_BASE_URL=http://127.0.0.1:11434
      - SEARCH_API_URL=http://127.0.0.1:8080
    # Переопределяем команду запуска через .venv
    command: .venv/bin/python -m uvicorn bot_service:app --host 127.0.0.1 --port 8081
    volumes:
      - ./src/bot/config.json:/app/config.json
    depends_on:
      - search-api

  # МИКРОСЕРВИС 3: GUI на Chainlit
  frontend-service:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: frontend_chainlit_service
    working_dir: /app
    network_mode: host
    environment:
      - PORT=8000
      - BOT_API_URL=http://127.0.0.1:8081/ask
      - RAG_API_URL=http://127.0.0.1:8080/search
      - FRONTEND_HTTP_TIMEOUT=180
    command: .venv/bin/chainlit run app.py --host 127.0.0.1 --port 8000
    depends_on:
      - bot-api
      - search-api
