version: '3.9'

services:
  # МИКРОСЕРВИС 1: RAG
  search-api:
    build:
      context: .
      dockerfile: src/rag/Dockerfile
    container_name: search_api_service
    working_dir: /app
    network_mode: host
    volumes:
      - ./src/rag/config.json:/app/config.json
      - ./chroma_data:/app/chroma_data
      - ./.cache/huggingface:/app/.cache/huggingface

  # МИКРОСЕРВИС 2: Бот
  bot-api:
    build:
      context: .
      dockerfile: src/bot/Dockerfile
    container_name: bot_api_service
    working_dir: /app
    network_mode: host
    volumes:
      - ./src/bot/config.json:/app/config.json
    depends_on:
      - search-api

  # МИКРОСЕРВИС 3: GUI на Chainlit
  frontend-service:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: frontend_chainlit_service
    working_dir: /app
    network_mode: host
    volumes:
      - ./src/frontend/config.json:/app/config.json
    depends_on:
      - bot-api
      - search-api
